obra:
  titol: "Kumārasambhava — El Naixement del Déu de la Guerra"
  titol_original: "कुमारसम्भव (Kumārasambhava)"
  autor: "Kālidāsa"
  autor_original: "कालिदास"
  traductor: "Biblioteca Arion (traducció catalana sobre l'edició anglesa de R. T. H. Griffith)"
  any_original: "c. s. IV-V dC"
  any_traduccio: 2026
  llengua_original: "sànscrit"
  categoria: "oriental"
  genere: "poesia èpica"
  descripcio: >
    Poema èpic en sànscrit de Kālidāsa que narra el naixement de Kārttikeya
    (Skanda), déu de la guerra, fill de Śiva i Pārvatī (Umā). Un dels grans
    cànons de la poesia clàssica índia, hereu de la tradició mahākāvya. La
    presente edició catalana es basa en la traducció anglesa en vers de
    Ralph T. H. Griffith (1879, Trübner's Oriental Series), i inclou el
    prefaci i la nota de pronunciació de l'edició original així com les
    notes crítiques finals.
  font_original: "https://www.gutenberg.org/ebooks/31968"
