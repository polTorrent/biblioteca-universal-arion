audit:
  supervisor: GLM 5.2 (Arion, supervisió autònoma)
  audit_data: "2026-07-18"
  accio: "S'ha detectat i corregit greu mismarca: original.md contenia de fet KUMĀRASAMBHAVA (altre poema de Kālidāsa), no Meghadūta com deia la metadata anterior. S'ha renombrat la carpeta i corregit la metadata. S'ha eliminat també un bloc de meta-text al·lucinat insertat pel traductor IA al mig de traduccio.md (~línies 1098-1104). El verificador pot donar fals positiu d'al·lucinació per la presència de paratext (PREFACI, PRONUNCIACIÓ, 1879, LONDRES) que els patrons 'estrofa' i 'parlament' interpreten malament com a unitats numerades inventades — és un fals positiu conegut d'aquesta mena d'edicions angleses amb prefaci editorial."