# =============================================================================
# models.conf — Configuració centralitzada de models per a Biblioteca Arion
# =============================================================================
# Format: <grup>:<tipus> = <model> [timeout=<segons>]
# El worker llegeix aquest fitxer per seleccionar el model adequat.

# --- ADMINISTRACIÓ (models econòmics — no cal opus per tasques admin) ---
admin:metadata     = llama-3.3-70b           timeout=120
admin:glossari     = llama-3.3-70b           timeout=120
admin:web          = llama-3.3-70b           timeout=120
admin:test         = llama-3.3-70b           timeout=120
admin:default      = llama-3.3-70b           timeout=120

# --- TRADUCCIÓ (models privats — zero data retention) ---
# thinking=on: activa reasoning (més costós, millor per matís lèxic)
# thinking=off: resposta directa (més ràpida, més barata)
translate:filosofia  = kimi-k2-5             timeout=600  thinking=on
translate:poesia     = kimi-k2-5             timeout=600  thinking=on
translate:teatre     = kimi-k2-5             timeout=600  thinking=on
translate:narrativa  = llama-3.3-70b         timeout=600  thinking=off
translate:assaig     = llama-3.3-70b         timeout=600  thinking=off
translate:oriental   = qwen3-235b-a22b-thinking-2507  timeout=600  thinking=on
translate:default    = llama-3.3-70b         timeout=600  thinking=on

# --- FETCH ---
fetch:default      = mistral-small-3-2-24b-instruct  timeout=180  thinking=off

# --- REVISIÓ (models lleugers — no cal opus per revisar) ---
review:default     = llama-3.3-70b           timeout=120  thinking=off
supervisio:default = llama-3.3-70b           timeout=120  thinking=off
validacio:default  = llama-3.3-70b           timeout=120  thinking=off

# --- MODELS PER GÈNERE (usat per traduir_venice.py) ---
genre:filosofia = kimi-k2-5
genre:poesia    = kimi-k2-5
genre:teatre    = kimi-k2-5
genre:narrativa = llama-3.3-70b
genre:assaig    = llama-3.3-70b
genre:oriental  = qwen3-235b-a22b-thinking-2507
