name: Build i Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos per publicar a GitHub Pages amb el flux modern (artefacte + deploy).
permissions:
  contents: read
  pages: write
  id-token: write

# Un sol desplegament alhora; no cancel·lis un deploy en curs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependències
      run: |
        pip install jinja2 pyyaml markdown rich pydantic

    - name: Generar HTML
      run: python3 sistema/web/build.py --clean

    - name: Verificar enllaços interns
      run: python3 sistema/web/check_links.py

    - name: Configurar GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: Pujar l'artefacte del lloc
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy a GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
